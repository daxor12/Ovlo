<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>OVLO</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:linear-gradient(160deg,#f7fbff,#eef0ff 55%,#e9fbff);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;color:#2b3350}
.s{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}
.s.on{display:flex}
h1{font-size:56px;letter-spacing:.18em;margin:0 0 0 .18em;font-weight:800;background:linear-gradient(90deg,#22d3ee,#8b6cff);-webkit-background-clip:text;background-clip:text;color:transparent}
h2{margin:0;font-size:22px;font-weight:700}
.sub{letter-spacing:.35em;font-size:12px;color:#8a93b8;margin-bottom:28px}
.b{width:min(260px,80%);height:54px;border:0;border-radius:27px;font:700 17px inherit;font-family:inherit;color:#fff;background:linear-gradient(90deg,#22c7ee,#8b6cff);box-shadow:0 8px 24px rgba(110,130,255,.28)}
.b.g{background:#fff;color:#5a62d6;box-shadow:0 4px 16px rgba(110,130,255,.14)}
.b:active{transform:scale(.97)}.b:disabled{opacity:.5}
.lang{position:absolute;bottom:calc(18px + env(safe-area-inset-bottom));font-size:13px;color:#8a93b8;direction:ltr}
.lang span{padding:8px 6px}.lang .a{color:#5a62d6;font-weight:700}
.spin{width:60px;height:60px;border-radius:50%;border:4px solid #8b6cff33;border-top-color:#22d3ee;animation:r 1s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
.spin.ok{animation:none;border-color:#34d399}
.mid{font-size:11px;color:#a0a8c8;letter-spacing:.12em;direction:ltr}
.hint{font-size:13px;color:#8a93b8;min-height:18px}
#gm{padding:0}
#cv{border-radius:26px;box-shadow:0 10px 40px rgba(120,130,230,.22);touch-action:none;background:#fff}
#cdn{position:absolute;font-size:120px;font-weight:800;color:#6f7be8;pointer-events:none;animation:p .9s ease-out infinite}
@keyframes p{from{transform:scale(1.25);opacity:.3}to{transform:scale(1);opacity:1}}
#res{font-size:44px;font-weight:800;letter-spacing:.06em}#scr{font-size:30px;color:#6f7be8;margin-bottom:18px;direction:ltr}
</style></head><body>
<div id="hm" class="s on"><h1>OVLO</h1><div class="sub" data-i="sub"></div>
<button class="b" id="play" data-i="play"></button><button class="b g" id="inv" data-i="inv"></button>
<div class="lang"><span data-l="fa">فارسی</span>|<span data-l="en">English</span></div></div>
<div id="jn" class="s"><h2 data-i="jt"></h2><button class="b" id="jc" data-i="jc"></button><button class="b g" id="ck" data-i="ck"></button><div class="hint" id="jh"></div></div>
<div id="wt" class="s"><div class="spin"></div><h2 id="wtx"></h2><div class="hint" id="wh"></div><button class="b" id="rdy" hidden></button><button class="b g" id="inv2" data-i="inv"></button><div class="mid" id="mc"></div></div>
<div id="gm" class="s"><canvas id="cv"></canvas><div id="cdn" hidden></div></div>
<div id="dc" class="s"><h2 id="dm"></h2><button class="b" data-x data-i="ex"></button></div>
<div id="ov" class="s"><div id="res"></div><div id="scr"></div><button class="b" id="re" data-i="re"></button><button class="b g" data-x data-i="ex"></button></div>
<script>
const tg=window.Telegram&&Telegram.WebApp;try{tg.ready();tg.expand();tg.disableVerticalSwipes()}catch(e){}
const W=400,H=700,PR=34,UR=19,GOAL=150,$=i=>document.getElementById(i);
const L={en:{sub:'AIR HOCKEY',play:'Play',inv:'Invite Friend',wait:'Waiting for opponent...',joined:'Opponent connected ✓',conn:'Connecting...',find:'Finding an opponent...',busy:'Server is busy, please try again',tg:'Please open OVLO from inside Telegram',rc:'Reconnecting...',hint:'Send the invite — your friend should join within a minute',ready:'PLAY',wr:'Waiting...',jt:'Join our channel to play',jc:'Join Channel',ck:'Check Again',nj:"You haven't joined yet",dcm:'Opponent disconnected',full:'This match is full',win:'YOU WIN',lose:'YOU LOSE',re:'Rematch',ex:'Exit',go:'GO'},
fa:{sub:'ایر هاکی',play:'بازی',inv:'دعوت دوست',wait:'در انتظار حریف...',joined:'حریف متصل شد ✓',conn:'در حال اتصال...',find:'در حال پیدا کردن حریف...',busy:'سرور شلوغ است، دوباره امتحان کنید',tg:'لطفاً بازی را از داخل تلگرام باز کنید',rc:'در حال اتصال مجدد...',hint:'دعوت را بفرست؛ دوستت تا حدود یک دقیقه‌ی دیگر می‌رسد',ready:'شروع',wr:'منتظر...',jt:'برای بازی، عضو کانال شوید',jc:'عضویت در کانال',ck:'بررسی دوباره',nj:'هنوز عضو نشده‌اید',dcm:'حریف از بازی خارج شد',full:'این بازی پر است',win:'بردی!',lose:'باختی',re:'بازی مجدد',ex:'خروج',go:'برو'}};
let lang='en';try{lang=localStorage.ovlo||'en'}catch(e){}
const T=k=>L[lang][k];
function setLang(l){lang=l;try{localStorage.ovlo=l}catch(e){}document.documentElement.dir=l==='fa'?'rtl':'ltr';
 document.querySelectorAll('[data-i]').forEach(e=>e.textContent=T(e.dataset.i));
 document.querySelectorAll('[data-l]').forEach(e=>e.classList.toggle('a',e.dataset.l===l));
 if(ws&&roomMsg)uiRoom(roomMsg)}
document.querySelectorAll('[data-l]').forEach(e=>e.onclick=()=>setLang(e.dataset.l));
const show=i=>document.querySelectorAll('.s').forEach(e=>e.classList.toggle('on',e.id===i));

let ws=null,id='',idx=0,phase='home',pend=0,qm=0,rc=0,jq=0,roomMsg=null,buf=[],sc=[0,0],tm=180;
const rid=()=>[...crypto.getRandomValues(new Uint8Array(5))].map(b=>b.toString(16).padStart(2,'0')).join('');
function join(m,q){id=m;qm=q?1:0;$('inv2').hidden=!!q;roomMsg=null;show('wt');$('wtx').textContent=T('conn');$('wh').textContent='';$('rdy').hidden=true;$('mc').textContent=m?'#'+m.slice(-4):'';
 if(ws)ws.close();rc=0;jq=qm;conn()}
function conn(){const s=ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws');
 s.onopen=()=>s.send(JSON.stringify({t:'join',id,init:tg?tg.initData:'',q:jq}));
 s.onmessage=e=>on(JSON.parse(e.data));
 s.onclose=()=>{if(ws!==s||(phase!=='play'&&phase!=='cd'))return;
  if(rc<6){rc++;setTimeout(()=>{if(ws===s)conn()},1500)}else{phase='left';$('dm').textContent=T('dcm');show('dc')}}}
const out=m=>ws&&ws.readyState===1&&ws.send(JSON.stringify(m));
function invite(){const q='m_'+id;if(tg&&tg.switchInlineQuery)tg.switchInlineQuery(q,['users','groups','channels']);else prompt('Link',location.origin+'/?m='+id)}
function uiRoom(m){const j=m.n>1;$('wtx').textContent=T(j?'joined':'wait');$('wh').textContent=j?'':T(qm?'find':'hint');
 $('wt').querySelector('.spin').classList.toggle('ok',j);$('mc').textContent='#'+id.slice(-4);const b=$('rdy');b.hidden=m.n<2;b.disabled=!!m.ready[m.idx];b.textContent=T(m.ready[m.idx]?'wr':'ready');
 $('re').disabled=!!m.ready[m.idx]}
function on(m){switch(m.t){
 case 'err':if(m.c==='member'){show('jn')}else{$('dm').textContent=T({full:'full',busy:'busy',auth:'tg'}[m.c]||'dcm');show('dc')}break;
 case 'room':rc=0;roomMsg=m;idx=m.idx;if(m.id){id=m.id;jq=0}phase=m.p;uiRoom(m);if(m.p==='wait'){show('wt');if(pend){pend=0;invite()}}break;
 case 'count':phase='cd';show('gm');fit();if(m.n){buf=[];sc=[0,0];tm=180;mx=W/2;my=H-90}
  $('cdn').hidden=false;$('cdn').textContent=m.n||T('go');if(!m.n)setTimeout(()=>$('cdn').hidden=true,600);break;
 case 's':phase='play';if(!$('gm').classList.contains('on')){show('gm');fit()}snap(m);break;
 case 'goal':try{tg.HapticFeedback.impactOccurred('medium')}catch(e){}break;
 case 'over':phase='over';{const w=m.w===idx;$('res').textContent=T(w?'win':'lose');$('scr').textContent=m.sc[idx]+' — '+m.sc[1-idx];$('re').disabled=false;show('ov')}break;
 case 'left':phase='left';$('dm').textContent=T('dcm');show('dc')}}
$('play').onclick=()=>join('',1);$('inv').onclick=()=>{pend=1;join(rid())};$('inv2').onclick=invite;
$('rdy').onclick=()=>out({t:'ready'});$('re').onclick=()=>out({t:'ready'});
$('jc').onclick=()=>{const u='https://t.me/Daxor_unit';tg?tg.openTelegramLink(u):open(u)};
$('ck').onclick=()=>{$('jh').textContent='';join(id,qm);setTimeout(()=>{if($('jn').classList.contains('on'))$('jh').textContent=T('nj')},900)};
document.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{if(ws){const s=ws;ws=null;s.close()}phase='home';show('hm')});

// ---- rendering ----
const cv=$('cv'),cx=cv.getContext('2d'),oc=document.createElement('canvas'),ox=oc.getContext('2d');
let S=1,D=1;
function fit(){S=Math.min((innerWidth-16)/W,(innerHeight-16)/H);D=Math.min(devicePixelRatio||1,2);
 cv.style.width=W*S+'px';cv.style.height=H*S+'px';cv.width=W*S*D;cv.height=H*S*D;oc.width=cv.width;oc.height=cv.height;table()}
addEventListener('resize',fit);
function table(){const c=ox;c.setTransform(D*S,0,0,D*S,0,0);c.clearRect(0,0,W,H);
 const g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,'#f1ecff');g.addColorStop(.5,'#fafcff');g.addColorStop(1,'#e4f8ff');c.fillStyle=g;c.fillRect(0,0,W,H);
 c.strokeStyle='rgba(120,130,210,.22)';c.lineWidth=2;c.beginPath();c.moveTo(0,H/2);c.lineTo(W,H/2);c.stroke();
 c.beginPath();c.arc(W/2,H/2,64,0,7);c.stroke();
 c.beginPath();c.arc(W/2,0,GOAL/2+34,0,Math.PI);c.stroke();c.beginPath();c.arc(W/2,H,GOAL/2+34,Math.PI,0);c.stroke();
 const gx=W/2-GOAL/2,gy=W/2+GOAL/2;c.lineWidth=5;c.lineCap='round';
 const wall=(col,pts)=>{c.strokeStyle=col;c.shadowColor=col;c.shadowBlur=10;c.beginPath();pts.forEach((p,i)=>i?c.lineTo(...p):c.moveTo(...p));c.stroke()};
 wall('#9b7bff',[[gx,3],[3,3],[3,H/2]]);wall('#9b7bff',[[gy,3],[W-3,3],[W-3,H/2]]);
 wall('#22d3ee',[[3,H/2],[3,H-3],[gx,H-3]]);wall('#22d3ee',[[W-3,H/2],[W-3,H-3],[gy,H-3]]);c.shadowBlur=0}
const f=(a,b,t)=>a+(b-a)*t,fl=(x,y)=>idx?[W-x,H-y]:[x,y];
function snap(m){const k=fl(...m.k),p=m.p.map(q=>fl(...q));buf.push({t:performance.now(),k,me:p[idx],op:p[1-idx]});if(buf.length>12)buf.shift();sc=[m.sc[idx],m.sc[1-idx]];tm=m.tm}
let mx=W/2,my=H-90,lastSend=0,moved=0;
let lx=0,ly=0,drag=0;
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);drag=1;lx=e.clientX;ly=e.clientY});
cv.addEventListener('pointermove',e=>{if(!drag)return;mx=Math.min(W-PR,Math.max(PR,mx+(e.clientX-lx)/S));my=Math.min(H-PR,Math.max(H/2+PR,my+(e.clientY-ly)/S));lx=e.clientX;ly=e.clientY;moved=1});
const up=()=>{drag=0};cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
function ring(x,y,col){cx.globalAlpha=.16;cx.fillStyle=col;cx.beginPath();cx.arc(x,y,PR+8,0,7);cx.fill();cx.globalAlpha=1;
 cx.fillStyle='#fff';cx.strokeStyle=col;cx.lineWidth=6;cx.beginPath();cx.arc(x,y,PR-3,0,7);cx.fill();cx.stroke();
 cx.fillStyle=col;cx.beginPath();cx.arc(x,y,13,0,7);cx.fill()}
function frame(now){requestAnimationFrame(frame);if(phase!=='play'&&phase!=='cd')return;
 cx.setTransform(1,0,0,1,0,0);cx.drawImage(oc,0,0);cx.setTransform(D*S,0,0,D*S,0,0);
 cx.textAlign='center';cx.fillStyle='rgba(120,130,210,.16)';cx.font='800 120px system-ui';
 cx.fillText(sc[1],W/2,H/2-60);cx.fillText(sc[0],W/2,H/2+160);
 cx.textAlign='right';cx.fillStyle='#8a93b8';cx.font='600 15px system-ui';cx.fillText(Math.floor(tm/60)+':'+String(tm%60).padStart(2,'0'),W-14,H/2-10);
 let k=[W/2,H/2],op=[W/2,90],me=[W/2,H-90];
 if(buf.length){const rt=now-80;let a=buf[0],b=buf[0];
  for(let i=buf.length-1;i>=0;i--)if(buf[i].t<=rt){a=buf[i];b=buf[i+1]||a;break}
  if(buf[0].t>rt)a=b=buf[0];const t=b.t>a.t?Math.min(1,(rt-a.t)/(b.t-a.t)):0;
  k=[f(a.k[0],b.k[0],t),f(a.k[1],b.k[1],t)];op=[f(a.op[0],b.op[0],t),f(a.op[1],b.op[1],t)];me=[f(a.me[0],b.me[0],t),f(a.me[1],b.me[1],t)]}
 ring(op[0],op[1],'#8b6cff');
 cx.globalAlpha=.2;cx.fillStyle='#22d3ee';cx.beginPath();cx.arc(k[0],k[1],UR+6,0,7);cx.fill();cx.globalAlpha=1;
 cx.fillStyle='#fff';cx.strokeStyle='#67c8ee';cx.lineWidth=3;cx.beginPath();cx.arc(k[0],k[1],UR-1,0,7);cx.fill();cx.stroke();
 ring(mx,my,'#18b6e8');
 if(phase==='play'&&buf.length&&now-buf[buf.length-1].t>1500){cx.fillStyle='rgba(43,51,80,.75)';cx.font='700 22px system-ui';cx.textAlign='center';cx.fillText(T('rc'),W/2,H/2+8)}
 if(moved&&phase==='play'&&now-lastSend>16){lastSend=now;moved=0;out({t:'m',x:Math.round(mx),y:Math.round(my)})}}
setLang(lang);fit();requestAnimationFrame(frame);
const sp=(tg&&tg.initDataUnsafe&&tg.initDataUnsafe.start_param)||new URLSearchParams(location.search).get('m');
if(sp&&/^[\w-]{4,24}$/.test(sp))join(sp);
</script></body></html>
